<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Barber Shop</title>
<link rel="icon" href="assets/img/pole.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.15/locales-all.global.min.js"></script>
</head>
<body>
<header class="site-header">
  <div class="brand">
    <img class="pole" src="assets/img/pole.svg" alt="" aria-hidden="true" />
    <div class="brand-text">
      <h1><span class="site-nome-attivita">Barber Shop</span> <span class="header-desc">- Calendario prenotazioni</span></h1>
      <div class="contact-line"></div>
    </div>
  </div>
  <a href="admin/login.html" class="header-link">Area barbiere</a>
</header>

<main>
  <div class="card">
    <p class="legend"><span class="legend-dot"></span> Gli slot colorati indicano orari già occupati o di chiusura. Per prenotare, contatta direttamente il barbiere.</p>
    <div id="loading" class="loading-indicator"><span class="spinner"></span> Caricamento calendario...</div>
    <div id="calendar" style="display:none;"></div>
  </div>
</main>

<script type="module" src="assets/js/site-header.js"></script>
<script type="module" src="assets/js/public-calendar.js"></script>
</body>
</html>
