<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Accesso barbiere</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✂️</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>
<div class="login-wrapper">
  <div class="login-card">
    <div class="icon-badge">✂️</div>
    <span class="eyebrow">Barber Shop</span>
    <h1>Area barbiere</h1>
    <p class="subtitle">Accedi per gestire appuntamenti, servizi e orari.</p>
    <form id="login-form">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="username" />

      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password" />

      <div class="error-text" id="login-error"></div>

      <button type="submit" class="primary" id="login-submit">Accedi</button>
    </form>
    <p class="back-link"><a href="../index.html">&larr; Torna al calendario</a></p>
  </div>
</div>

<script type="module" src="../assets/js/auth.js"></script>
</body>
</html>
