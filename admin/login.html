<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Barber Shop</title>
<link rel="icon" href="../assets/img/pole.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>
<div class="login-wrapper">
  <div class="login-card">
    <img class="pole" src="../assets/img/pole.svg" alt="" aria-hidden="true" />
    <h1><span class="site-nome-attivita">Barber Shop</span> <span class="header-desc">- Area barbiere</span></h1>
    <div class="contact-line"></div>
    <p class="subtitle">Accedi per gestire appuntamenti, servizi e orari.</p>
    <form id="login-form">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="username" />

      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password" />

      <div class="error-text" id="login-error"></div>

      <button type="submit" class="primary" id="login-submit">Accedi</button>
    </form>
    <a href="../index.html" class="primary back-link">&larr; Torna al calendario</a>
  </div>
</div>

<script type="module" src="../assets/js/site-header.js"></script>
<script type="module" src="../assets/js/auth.js"></script>
</body>
</html>
