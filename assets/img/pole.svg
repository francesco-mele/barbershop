<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 64" width="20" height="64">
  <defs>
    <pattern id="poleStripes" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="20" height="20" fill="#F3ECDD" />
      <rect width="7" height="20" fill="#9E3B36" />
      <rect x="13" width="7" height="20" fill="#2E5B8A" />
      <animate attributeName="y" from="0" to="20" dur="0.9s" repeatCount="indefinite" />
    </pattern>
  </defs>
  <rect x="1" y="1" width="18" height="62" rx="8" fill="url(#poleStripes)" stroke="#3C3025" stroke-width="1" />
</svg>
